name: Dependency Security & Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  audit:
    name: NPM Audit Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Run NPM Audit
        run: |
          npm audit --audit-level=critical || echo "Audit completed with non-critical findings"
        continue-on-error: true
