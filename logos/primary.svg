<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aalm Vastralay Primary Logo">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#4A148C" />
    </linearGradient>
  </defs>
  <!-- Monogram Medallion -->
  <g transform="translate(40, 20)">
    <circle cx="80" cy="80" r="76" fill="#4A148C" />
    <circle cx="80" cy="80" r="70" fill="none" stroke="#D4AF37" stroke-width="3" stroke-opacity="0.9" />
    <circle cx="80" cy="80" r="64" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4, 3" stroke-opacity="0.6" />
    <text x="80" y="106" font-family="Georgia, 'Playfair Display', serif" font-size="78" font-weight="bold" fill="url(#primary-grad)" text-anchor="middle">AV</text>
  </g>
  <!-- Wordmark -->
  <text x="240" y="98" font-family="Georgia, 'Playfair Display', serif" font-size="52" font-weight="700" letter-spacing="1.5" fill="#4A148C">
    AALM <tspan fill="#D4AF37">VASTRALAY</tspan>
  </text>
  <text x="242" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#800020">
    WEDDING &amp; ETHNIC WEAR · BIHAR
  </text>
</svg>
