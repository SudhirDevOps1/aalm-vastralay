<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aalm Vastralay Secondary Stacked Logo">
  <defs>
    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#4A148C" />
    </linearGradient>
  </defs>
  <!-- Medallion on top -->
  <g transform="translate(100, 40)">
    <circle cx="100" cy="100" r="96" fill="#4A148C" />
    <circle cx="100" cy="100" r="88" fill="none" stroke="#D4AF37" stroke-width="4" stroke-opacity="0.9" />
    <circle cx="100" cy="100" r="80" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6, 4" stroke-opacity="0.6" />
    <text x="100" y="132" font-family="Georgia, 'Playfair Display', serif" font-size="96" font-weight="bold" fill="url(#sec-grad)" text-anchor="middle">AV</text>
  </g>
  <!-- Brand text below -->
  <text x="200" y="300" font-family="Georgia, 'Playfair Display', serif" font-size="44" font-weight="700" letter-spacing="2" fill="#4A148C" text-anchor="middle">
    AALM
  </text>
  <text x="200" y="350" font-family="Georgia, 'Playfair Display', serif" font-size="44" font-weight="700" letter-spacing="2" fill="#D4AF37" text-anchor="middle">
    VASTRALAY
  </text>
  <line x1="120" y1="380" x2="280" y2="380" stroke="#800020" stroke-width="2" stroke-opacity="0.5" />
  <text x="200" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="5" fill="#800020" text-anchor="middle">
    WEDDING &amp; ETHNIC WEAR
  </text>
  <text x="200" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#6B7280" text-anchor="middle">
    HANDCRAFTED · INDIA
  </text>
</svg>
